<style>
  :root{
    --ink:#111111;
    --muted:#76746f;
    --line:#e6e4df;
    --accent:#b3202c;
    --gold:#c9a227;
    --silver:#9aa0a6;
    --bronze:#b0793f;
    --card:#fafaf8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#ffffff;color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1120px;margin:0 auto;padding:8px 20px 60px}
  .yearnav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:10px 0 26px;position:sticky;top:0;background:rgba(255,255,255,.96);z-index:5;border-bottom:1px solid var(--line)}
  .yearnav a{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.06em;color:var(--ink);text-decoration:none;padding:4px 16px;border:1px solid var(--line);border-radius:999px;line-height:1.2}
  .yearnav a:hover{border-color:var(--accent);color:var(--accent)}
  .yearhead{font-family:'Bebas Neue',sans-serif;font-size:44px;letter-spacing:.08em;margin:44px 0 4px;text-transform:uppercase;scroll-margin-top:70px}
  .yearhead span{color:var(--accent)}
  .yearsub{color:var(--muted);font-size:13px;margin-bottom:18px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px 20px 16px;display:flex;flex-direction:column}
  .card:hover{border-color:#cfcdc7}
  .date{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:.05em;line-height:1;text-transform:uppercase}
  .tag{display:inline-block;margin-top:8px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:var(--accent);border-radius:3px;padding:3px 8px;align-self:flex-start}
  .divs{margin-top:14px;flex:1}
  .div{padding:9px 0;border-top:1px solid var(--line)}
  .divname{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
  .pl{list-style:none}
  .pl li{font-size:14px;font-weight:500;padding:1.5px 0;display:flex;align-items:baseline;gap:8px}
  .pl .n{font-family:'Bebas Neue',sans-serif;font-size:14px;width:14px;flex:none;text-align:center}
  .pl li:nth-child(1) .n{color:var(--gold)}
  .pl li:nth-child(2) .n{color:var(--silver)}
  .pl li:nth-child(3) .n{color:var(--bronze)}
  .fr{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
  .fr a{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);text-decoration:none}
  .fr a:hover{color:var(--accent)}
  .fr a::after{content:" \2192"}
  .foot{margin-top:52px;text-align:center;color:var(--muted);font-size:12px;line-height:1.7}
  @media (max-width:720px){ .grid{grid-template-columns:1fr} .yearhead{font-size:36px} }
</style>
</head>

<script>
(function(){
  var MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
  function fmt(d){var p=d.split("-");return MONTHS[+p[1]-1]+" "+(+p[2])+", "+p[0];}
  var byYear={};
  MATCHES.forEach(function(m){var y=m.date.slice(0,4);(byYear[y]=byYear[y]||[]).push(m);});
  var years=Object.keys(byYear).sort().reverse();
  var nav=document.getElementById("yearnav");
  years.forEach(function(y){var a=document.createElement("a");a.href="#y"+y;a.textContent=y;nav.appendChild(a);});
  var content=document.getElementById("content");
  years.forEach(function(y){
    var list=byYear[y].sort(function(a,b){return a.date<b.date?1:-1;});
    var h=document.createElement("h2");h.className="yearhead";h.id="y"+y;
    h.innerHTML=y+" <span>Season</span>";
    var sub=document.createElement("p");sub.className="yearsub";
    sub.textContent=list.length+(list.length===1?" match":" matches");
    var grid=document.createElement("div");grid.className="grid";
    list.forEach(function(m){
      var card=document.createElement("article");card.className="card";
      var html='<div class="date">'+fmt(m.date)+'</div>'
        +'<span class="tag">'+m.label+'</span>'
        +'<div class="divs">';
      m.divs.forEach(function(dv){
        html+='<div class="div"><div class="divname">'+dv[0]+'</div><ol class="pl">';
        dv[1].forEach(function(name,i){
          html+='<li><span class="n">'+(i+1)+'</span><span>'+name+'</span></li>';
        });
        html+='</ol></div>';
      });
      html+='</div><div class="fr"><a href="'+m.url+'" target="_blank" rel="noopener">Full Results on PractiScore</a></div>';
      card.innerHTML=html;
      grid.appendChild(card);
    });
    content.appendChild(h);content.appendChild(sub);content.appendChild(grid);
  });
})();
</script>
