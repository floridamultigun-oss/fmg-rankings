<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Florida Multigun — Annual Points Rankings</title>
<style>
  :root{
    --bg:#111417; --panel:#1b2026; --panel2:#232a32; --line:#2e3742;
    --text:#e8ecf1; --muted:#93a0ae; --accent:#e4572e; --gold:#f2b134;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--text); font:15px/1.45 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; padding:18px 12px 40px;}
  .wrap{max-width:940px; margin:0 auto;}
  header h1{font-size:26px; font-weight:800; letter-spacing:.5px; text-transform:uppercase;}
  header h1 span{color:var(--accent);}
  header .sub{color:var(--muted); font-size:13px; margin-top:4px;}
  .tabs{display:flex; flex-wrap:wrap; gap:8px; margin:18px 0 10px;}
  .tabs .grp{display:flex; gap:6px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:5px;}
  .tabs button{background:transparent; color:var(--muted); border:0; padding:7px 14px; border-radius:7px; font-weight:700; font-size:14px; cursor:pointer;}
  .tabs button.on{background:var(--accent); color:#fff;}
  .toolbar{display:flex; gap:10px; align-items:center; margin:10px 0 14px; flex-wrap:wrap;}
  .toolbar input{flex:1; min-width:200px; background:var(--panel); border:1px solid var(--line); color:var(--text); padding:9px 12px; border-radius:8px; font-size:14px;}
  .meta{color:var(--muted); font-size:12.5px;}
  table{width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden;}
  thead th{background:var(--panel2); color:var(--muted); text-transform:uppercase; font-size:11px; letter-spacing:.6px; padding:10px 8px; text-align:right; cursor:default;}
  thead th:nth-child(2){text-align:left;}
  tbody td{padding:9px 8px; border-top:1px solid var(--line); text-align:right; font-variant-numeric:tabular-nums;}
  tbody td:nth-child(2){text-align:left; font-weight:600;}
  tbody tr.rankrow{cursor:pointer;}
  tbody tr.rankrow:hover{background:#20262e;}
  .r1 td:first-child,.r2 td:first-child,.r3 td:first-child{font-weight:800;}
  .r1 td:first-child{color:var(--gold);} .r2 td:first-child{color:#cfd6dd;} .r3 td:first-child{color:#d08a4e;}
  .pts{color:var(--accent); font-weight:800;}
  .hist td{background:#161b20; padding:0 8px 10px;}
  .hist table{border:0; background:transparent;}
  .hist th{font-size:10px; padding:6px 8px; background:transparent;}
  .hist td{border-top:1px solid #232a32 !important; padding:5px 8px !important; font-size:13px; color:var(--muted);}
  footer{color:var(--muted); font-size:12px; margin-top:22px; line-height:1.6;}
  @media (max-width:600px){ .hide-sm{display:none;} body{padding:10px 6px 30px;} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Florida <span>Multigun</span> Rankings</h1>
    <div class="sub" id="subtitle">Annual points standings from posted PractiScore match results</div>
  </header>

  <div class="tabs">
    <div class="grp" id="catTabs"></div>
    <div class="grp" id="yearTabs"></div>
  </div>

  <div class="toolbar">
    <input id="search" type="search" placeholder="Find a shooter…">
    <div class="meta" id="metaLine"></div>
  </div>

  <table id="board">
    <thead><tr>
      <th style="text-align:right">#</th><th>Shooter</th><th>Matches</th>
      <th>Points<br>(Match&nbsp;%)</th><th class="hide-sm">Raw Match<br>Points</th>
      <th class="hide-sm">Best %</th><th class="hide-sm">Avg %</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>

  <footer id="foot"></footer>
</div>

<script>
let DATA=null, state={cat:"3-Gun", year:null};

function canon(name, aliases){
  const n = name.replace(/\s+/g,' ').trim();
  const k = n.toLowerCase();
  if (aliases[k]) return aliases[k];
  if (n===n.toLowerCase() || n===n.toUpperCase())
    return n.split(',').map(p=>p.trim().replace(/\b\w/g,c=>c.toUpperCase())).join(', ');
  return n;
}

function build(){
  const twoGun = new Set(DATA.two_gun_dates);
  const noPts = new Set(DATA.no_points_uuids);
  const rows=[];
  for(const m of DATA.matches){
    const cat = twoGun.has(m.date) ? "2-Gun/PCC" : "3-Gun";
    const year = m.date.slice(0,4);
    const best = new Map();
    for(const r of m.rows){
      const nm = canon(r[0], DATA.aliases);
      const pct = parseFloat(r[2])||0;
      let pts = parseFloat(r[3])||0;
      if(noPts.has(m.u)) pts = 0;
      const cur = best.get(nm);
      if(!cur || pct > cur.pct) best.set(nm,{pct,pts,div:r[1]});
    }
    for(const [nm,v] of best) rows.push({year,cat,date:m.date,match:m.name,shooter:nm,...v});
  }
  return rows;
}

function render(){
  const rows = build();
  const years = [...new Set(rows.filter(r=>r.cat===state.cat).map(r=>r.year))].sort().reverse();
  if(!state.year || !years.includes(state.year)) state.year = years[0];

  const yt=document.getElementById('yearTabs'); yt.innerHTML='';
  years.forEach(y=>{
    const b=document.createElement('button'); b.textContent=y;
    if(y===state.year) b.className='on';
    b.onclick=()=>{state.year=y; render();};
    yt.appendChild(b);
  });
  const ct=document.getElementById('catTabs'); ct.innerHTML='';
  ["3-Gun","2-Gun/PCC"].forEach(c=>{
    const b=document.createElement('button'); b.textContent=c;
    if(c===state.cat) b.className='on';
    b.onclick=()=>{state.cat=c; render();};
    ct.appendChild(b);
  });

  const sel = rows.filter(r=>r.cat===state.cat && r.year===state.year);
  const agg = new Map();
  for(const r of sel){
    const a = agg.get(r.shooter) || {n:0,pct:0,pts:0,best:0,hist:[]};
    a.n++; a.pct+=r.pct; a.pts+=r.pts; a.best=Math.max(a.best,r.pct);
    a.hist.push(r); agg.set(r.shooter,a);
  }
  const standings=[...agg.entries()].sort((a,b)=>b[1].pct-a[1].pct);
  const nMatches=new Set(sel.map(r=>r.date)).size;
  document.getElementById('metaLine').textContent =
    `${state.cat} • ${state.year} • ${nMatches} matches • ${standings.length} shooters`;

  const q=document.getElementById('search').value.trim().toLowerCase();
  const tb=document.getElementById('rows'); tb.innerHTML='';
  standings.forEach(([nm,a],i)=>{
    if(q && !nm.toLowerCase().includes(q)) return;
    const tr=document.createElement('tr');
    tr.className='rankrow r'+(i+1);
    tr.innerHTML=`<td>${i+1}</td><td>${nm}</td><td>${a.n}</td>`+
      `<td class="pts">${a.pct.toFixed(2)}</td>`+
      `<td class="hide-sm">${a.pts.toFixed(2)}</td>`+
      `<td class="hide-sm">${a.best.toFixed(2)}</td>`+
      `<td class="hide-sm">${(a.pct/a.n).toFixed(2)}</td>`;
    tr.onclick=()=>{
      const nxt=tr.nextElementSibling;
      if(nxt && nxt.classList.contains('hist')){nxt.remove(); return;}
      document.querySelectorAll('tr.hist').forEach(e=>e.remove());
      const h=document.createElement('tr'); h.className='hist';
      const items=a.hist.sort((x,y)=>x.date.localeCompare(y.date))
        .map(x=>`<tr><td>${x.date}</td><td style="text-align:left">${x.div}</td><td>${x.pct.toFixed(2)}%</td><td>${x.pts?x.pts.toFixed(2):'—'}</td></tr>`).join('');
      h.innerHTML=`<td colspan="7"><table><thead><tr><th style="text-align:right">Date</th><th style="text-align:left">Division</th><th>Match %</th><th>Match Pts</th></tr></thead><tbody>${items}</tbody></table></td>`;
      tr.after(h);
    };
    tb.appendChild(tr);
  });

  document.getElementById('foot').innerHTML =
    `Points (Match %) = sum of each shooter's overall match percentage (match winner = 100) across the year's matches. `+
    `Raw Match Points = PractiScore combined match points, summed. Championships count in 3-Gun; 5th-Saturday 2-Gun/PCC matches ranked separately. `+
    `The Jan 2026 Trial of Champions was scored pure time-plus and adds 0 raw points. `+
    `Click any shooter for match-by-match history. Data: PractiScore posted results • Updated ${DATA.updated}.`;
}

document.getElementById('search').addEventListener('input',()=>render());
fetch('data.json?v='+Date.now()).then(r=>r.json()).then(d=>{DATA=d; render();})
  .catch(e=>{document.getElementById('metaLine').textContent='Could not load rankings data.';});
</script>
</body>
</html>
