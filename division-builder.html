<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Florida Multigun — Loadout Builder</title>
<style>
  :root{
    --bg:#0a0f13; --panel:rgba(13,19,24,0.88); --panel2:rgba(20,28,34,0.92);
    --line:#2c3840; --line2:#41505b;
    --amber:#ff9a2e; --amber-dim:#8a5d1a;
    --txt:#d9e0e6; --dim:#8b99a3; --faint:#59656e;
    --ok:#5fd68b; --bad:#ff5c5c;
    --font:'Bahnschrift','DIN Alternate','Franklin Gothic Medium','Arial Narrow',Arial,sans-serif;
    --mono:'Consolas','Menlo','Courier New',monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--bg); color:var(--txt); font-family:var(--font);}
  body{min-height:100vh; overflow-x:hidden;}
  .clip{clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);}
  .clip-sm{clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px);}

  /* ============ TOP BAR ============ */
  header{
    display:flex; align-items:center; gap:22px; flex-wrap:wrap;
    padding:14px 28px; border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, rgba(16,23,28,.95), rgba(10,15,19,.9));
    position:relative; z-index:5;
  }
  header h1{font-size:20px; letter-spacing:3px; text-transform:uppercase; color:#fff; font-weight:700; white-space:nowrap;}
  header h1 span{color:var(--amber);}
  nav{display:flex; gap:4px;}
  .tab{
    background:transparent; border:1px solid transparent; color:var(--dim);
    padding:9px 22px; cursor:pointer; font-family:var(--font);
    font-size:14px; letter-spacing:3px; text-transform:uppercase; font-weight:700; transition:all .15s;
  }
  .tab:hover{color:var(--txt);}
  .tab.active{color:var(--amber); border-color:var(--line2); background:rgba(255,154,46,.07); box-shadow:inset 0 -2px 0 var(--amber);}
  .hdr-right{margin-left:auto; display:flex; gap:10px; align-items:center;}
  .match-pill{background:var(--panel); border:1px solid var(--line); padding:6px 16px;}
  .match-pill .l{font-size:9px; letter-spacing:2px; color:var(--dim); text-transform:uppercase;}
  .match-pill .v{font-size:15px; font-weight:700; letter-spacing:1.5px; color:var(--amber); text-transform:uppercase;}
  .flag{font-family:var(--mono); font-size:10px; letter-spacing:1px; padding:5px 10px; border:1px dashed var(--line2); color:var(--faint); text-transform:uppercase;}
  .flag.on{border:1px solid var(--ok); color:var(--ok); background:rgba(95,214,139,.07);}

  /* ============ STAGE ============ */
  .screen{display:none;}
  .screen.active{display:block;}
  .stage{
    position:relative; height:calc(100vh - 64px); min-height:640px; overflow:hidden;
    background:
      radial-gradient(ellipse 60% 45% at 50% 46%, rgba(140,180,200,0.17), transparent 70%),
      radial-gradient(ellipse 90% 80% at 50% 50%, rgba(0,0,0,0) 40%, rgba(0,0,0,.55) 100%),
      repeating-linear-gradient(90deg, #0e1519 0px, #121a1f 55px, #0c1216 110px, #10181d 165px, #0e1519 220px),
      #0a0f13;
  }
  .stage::after{ /* floor glow */
    content:''; position:absolute; left:15%; right:15%; top:68%; height:1px;
    background:linear-gradient(90deg, transparent, rgba(140,180,200,.12), transparent);
  }
  .wires{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:2;}
  .wires line{stroke:rgba(215,225,232,.35); stroke-width:1;}
  .wires circle{fill:#dfe6ec;}
  .gun-wrap{
    position:absolute; left:50%; top:47%; transform:translate(-50%,-50%);
    width:min(62vw, 980px); z-index:1; pointer-events:none;
  }
  .gun-wrap svg{width:100%; height:auto; filter:drop-shadow(0 24px 30px rgba(0,0,0,.55));}
  .gun-wrap .layer-img{position:absolute; inset:0; width:100%; height:auto;}
  model-viewer{width:100%; height:520px; pointer-events:auto;}

  /* attachment nodes */
  .node{
    position:absolute; transform:translate(-50%,-50%); z-index:3; width:120px;
    cursor:pointer; text-align:center;
  }
  .node .n-lbl{
    font-size:10px; letter-spacing:2px; color:var(--dim); text-transform:uppercase; margin-bottom:5px;
    text-shadow:0 1px 3px #000;
  }
  .node.conflict .n-lbl{color:var(--amber);}
  .node .n-box{
    width:58px; height:58px; margin:0 auto; border:1px solid var(--line2);
    background:linear-gradient(160deg, rgba(30,40,48,.92), rgba(12,17,21,.92));
    display:flex; align-items:center; justify-content:center; transition:all .15s;
    box-shadow:0 4px 14px rgba(0,0,0,.5);
  }
  .node:hover .n-box{border-color:var(--amber); box-shadow:0 0 14px rgba(255,154,46,.35);}
  .node.sel .n-box{border-color:var(--amber); background:linear-gradient(160deg, rgba(70,52,24,.95), rgba(24,18,10,.95));}
  .node .n-box svg{width:38px; height:38px;}
  .node .n-cur{
    font-family:var(--mono); font-size:9.5px; color:var(--txt); margin-top:5px; letter-spacing:.5px;
    text-shadow:0 1px 3px #000; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  /* left info block */
  .info{
    position:absolute; left:28px; top:26px; z-index:4; max-width:330px;
  }
  .info .w-name{font-size:44px; font-weight:700; letter-spacing:4px; text-transform:uppercase; color:#fff; line-height:1; text-shadow:0 2px 10px #000;}
  .info .w-div-lbl{font-size:10px; letter-spacing:3px; color:var(--dim); text-transform:uppercase; margin-top:14px;}
  .info .w-div{
    display:inline-block; margin-top:6px; padding:8px 18px;
    border:1px solid var(--amber); color:var(--amber); font-size:20px; font-weight:700;
    letter-spacing:2px; text-transform:uppercase; background:rgba(255,154,46,.08);
    box-shadow:0 0 18px rgba(255,154,46,.15);
  }
  .info .g-flags{margin-top:10px; display:flex; gap:8px;}

  /* stats / eligibility panel bottom-right */
  .stats{
    position:absolute; right:28px; bottom:26px; z-index:4; width:300px;
    background:var(--panel); border:1px solid var(--line); padding:14px 16px;
    backdrop-filter:blur(3px);
  }
  .stats h3{font-size:10px; letter-spacing:2.5px; color:var(--dim); text-transform:uppercase; margin-bottom:10px;}
  .st-row{
    display:flex; align-items:center; gap:10px; padding:7px 8px; cursor:pointer;
    border:1px solid transparent; transition:border-color .15s;
  }
  .st-row:hover{border-color:var(--line2);}
  .st-row .n{flex:1; font-size:13px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase;}
  .st-row .s{font-family:var(--mono); font-size:10px; letter-spacing:1px;}
  .st-row.ok .n{color:var(--txt);} .st-row.ok .s{color:var(--ok);}
  .st-row.bad .n{color:var(--faint); text-decoration:line-through;} .st-row.bad .s{color:var(--bad);}
  .st-bar{height:3px; background:#1b232a; margin:2px 8px 8px; position:relative;}
  .st-bar i{position:absolute; inset:0; right:auto; background:var(--ok);}
  .st-row.bad + .st-bar i{background:var(--bad);}
  .stats .actions{display:flex; gap:8px; margin-top:12px;}
  button.act{
    flex:1; background:var(--amber); color:#14100a; border:none; font-family:var(--font);
    font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase;
    padding:10px 8px; cursor:pointer;
  }
  button.act:hover{background:#ffb054;}
  button.act.ghost{background:transparent; color:var(--amber); border:1px solid var(--amber-dim);}
  button.act.ghost:hover{border-color:var(--amber);}
  .copied{font-family:var(--mono); font-size:10px; color:var(--ok); opacity:0; transition:opacity .3s; text-align:center; margin-top:6px;}
  .copied.show{opacity:1;}

  /* violations flyout */
  .viol{
    position:absolute; right:28px; bottom:260px; z-index:6; width:340px;
    background:var(--panel2); border:1px solid rgba(255,92,92,.4); padding:14px 16px;
  }
  .viol h4{font-size:11px; letter-spacing:2px; color:var(--bad); text-transform:uppercase; margin-bottom:8px;}
  .viol ul{list-style:none;}
  .viol li{font-family:var(--mono); font-size:11.5px; color:var(--txt); border-left:2px solid var(--bad); padding:3px 0 3px 10px; margin:5px 0;}
  .viol .allclear{font-family:var(--mono); font-size:11.5px; color:var(--ok);}
  .viol .x{position:absolute; top:8px; right:10px; cursor:pointer; color:var(--dim); font-family:var(--mono);}
  .viol .x:hover{color:#fff;}

  /* attachment select flyout */
  .flyout{
    position:absolute; left:28px; bottom:26px; z-index:6; width:380px; max-height:66%;
    background:var(--panel2); border:1px solid var(--line2); display:flex; flex-direction:column;
    box-shadow:0 10px 40px rgba(0,0,0,.6); backdrop-filter:blur(4px);
  }
  .flyout .f-head{
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 16px; border-bottom:1px solid var(--line);
  }
  .flyout .f-head .t{font-size:13px; font-weight:700; letter-spacing:2.5px; text-transform:uppercase; color:var(--amber);}
  .flyout .f-head .x{cursor:pointer; color:var(--dim); font-family:var(--mono); padding:2px 8px;}
  .flyout .f-head .x:hover{color:#fff;}
  .flyout .f-body{overflow-y:auto;}
  .opt{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:11px 16px; cursor:pointer; border-bottom:1px solid rgba(44,56,64,.5); transition:background .12s;
  }
  .opt:hover{background:rgba(255,154,46,.06);}
  .opt.sel{background:rgba(255,154,46,.12); box-shadow:inset 3px 0 0 var(--amber);}
  .opt .o-name{font-size:13.5px; color:var(--txt);}
  .opt .o-sub{font-family:var(--mono); font-size:10px; color:var(--faint); display:block; margin-top:2px;}
  .pills{display:flex; gap:4px; flex-shrink:0;}
  .pill{font-family:var(--mono); font-size:9px; letter-spacing:.5px; padding:2px 6px; border:1px solid var(--line2); color:var(--dim);}
  .pill.y{border-color:rgba(95,214,139,.5); color:var(--ok);}
  .pill.n{border-color:rgba(255,92,92,.4); color:var(--bad); text-decoration:line-through;}
  .pill.g{border-color:var(--amber-dim); color:var(--amber);}

  footer{
    position:absolute; left:28px; bottom:4px; z-index:3;
    font-family:var(--mono); font-size:9.5px; color:var(--faint);
  }
  footer a{color:var(--dim);}
  @media (max-width:1100px){
    .info .w-name{font-size:30px;}
    .stats{width:250px;}
    .gun-wrap{width:78vw;}
  }

  /* ============ MOBILE / NARROW LAYOUT ============ */
  @media (max-width: 840px){
    .stage{display:flex; flex-direction:column; height:auto; min-height:0; overflow:visible; padding:12px 12px 30px;}
    .wires{display:none;}
    .info{position:static; order:-2; max-width:none; margin:2px 0 6px;}
    .info .w-name{font-size:28px;}
    .gun-wrap{position:static; transform:none; width:100%; order:-1; margin:4px 0 10px; pointer-events:auto;}
    .node{position:static; transform:none; width:auto; display:flex; align-items:center; gap:12px; text-align:left;
          border:1px solid var(--line); background:var(--panel); padding:8px 12px; margin:4px 0;}
    .node .n-box{width:44px; height:44px; flex-shrink:0; margin:0; order:-1;}
    .node .n-box svg{width:30px; height:30px;}
    .node .n-lbl{margin:0; width:104px; flex-shrink:0;}
    .node .n-cur{margin:0; white-space:normal; flex:1;}
    .stats{position:static; width:auto; order:10; margin-top:12px;}
    .viol{position:fixed; left:10px; right:10px; bottom:10px; width:auto; z-index:50;}
    .flyout{position:fixed; left:10px; right:10px; bottom:10px; width:auto; max-height:70vh; z-index:60;}
    footer{position:static; order:11; margin-top:12px;}
    header{padding:10px 12px; gap:10px;}
    header h1{font-size:15px; letter-spacing:2px;}
    nav{order:3; width:100%; justify-content:center;}
    .tab{padding:8px 14px; font-size:12px; letter-spacing:2px; flex:1;}
    header .flag{display:none;}
    .match-pill{padding:4px 10px;}
    .match-pill .v{font-size:12px;}
  }
</style>
</head>
<body>

<header>
  <h1>Florida <span>Multigun</span></h1>
  <nav>
    <button class="tab active" id="tab-rifle" onclick="showTab('rifle')">Rifle</button>
    <button class="tab" id="tab-pistol" onclick="showTab('pistol')">Pistol</button>
    <button class="tab" id="tab-shotgun" onclick="showTab('shotgun')">Shotgun</button>
  </nav>
  <div class="hdr-right">
    <div class="flag" id="flag-heavy" title="Heavy: rifle in .308 / 6.5 / 7.62x39 AND pistol .40 cal or larger. Velocity ≤ 3,000 fps, no penetrator ammo. Only 1 hit on paper required.">HEAVY</div>
    <div class="flag" id="flag-goofy" title="Goofy Gun: oddball equipment — revolvers, double-barrels, bolt-actions, historical firearms — run under the standard restrictions.">GOOFY</div>
    <div class="match-pill clip-sm">
      <div class="l">Match Division</div>
      <div class="v" id="matchDiv">—</div>
    </div>
  </div>
</header>

<div class="screen active" id="screen-rifle"></div>
<div class="screen" id="screen-pistol"></div>
<div class="screen" id="screen-shotgun"></div>

<script>
/* =====================================================================
   OPTIONAL EXTERNAL RENDERS — drop in files from another program.
   1) 3D: export a .glb from Blender (or license one) and set MODELS.
      The stage swaps to an orbitable 3D viewer automatically.
   2) 2D photoreal: render the bare gun + each attachment as aligned,
      transparent PNGs from a locked camera and set IMAGES. Attachment
      layers toggle with the same option ids used by the rules engine.
   Leave empty to use the built-in vector renders.
   ===================================================================== */
const MODELS = { rifle:'', pistol:'', shotgun:'' };            // e.g. rifle:'models/rifle.glb'
const IMAGES = {                                               // e.g. rifle:{ base:'img/rifle.png', overlays:{ optic:{ dot:'img/rifle-dot.png' } } }
  rifle:{ base:'', overlays:{} },
  pistol:{ base:'', overlays:{} },
  shotgun:{ base:'', overlays:{} }
};
const MODEL_VIEWER_CDN = 'https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js';

/* =====================================================================
   RULES DATA — per-division legality. tac/mod: true = legal,
   string = violation reason. Open is always legal.
   ===================================================================== */
const DIV_META = {
  tac:  { name:'Tactical / Limited', short:'TAC' },
  mod:  { name:'Modified (CO)',      short:'MOD' },
  open: { name:'Open',               short:'OPEN' }
};

const WEAPONS = {
  rifle: {
    label:'Rifle',
    slots: [
      { id:'platform', label:'Receiver / Platform', icon:'receiver', opts:[
        { id:'factory', name:'Factory Semi-Auto (AR-pattern)', sub:'Factory configuration, internal mods OK', tac:true, mod:true },
        { id:'custom',  name:'Custom / Race Configuration',    sub:'Non-factory appearance or configuration', tac:'Tactical requires factory configuration & appearance', mod:'Modified requires factory configuration & appearance' },
        { id:'bolt',    name:'Bolt-Action / Historical',       sub:'Oddball platform — Goofy Gun candidate', tac:true, mod:true, goofy:true }
      ]},
      { id:'caliber', label:'Chambering', icon:'ammo', opts:[
        { id:'556', name:'5.56 NATO / .223 Rem', sub:'Standard multigun chambering', tac:true, mod:true },
        { id:'308', name:'.308 Win',             sub:'Heavy Division caliber', tac:true, mod:true, heavy:true },
        { id:'65',  name:'6.5 Creedmoor',        sub:'Heavy Division caliber', tac:true, mod:true, heavy:true },
        { id:'762', name:'7.62x39',              sub:'Heavy Division caliber', tac:true, mod:true, heavy:true }
      ]},
      { id:'optic', label:'Optic', icon:'optic', opts:[
        { id:'irons',  name:'Iron Sights Only',            sub:'Fixed or popup', tac:true, mod:true },
        { id:'dot',    name:'Red Dot (non-magnified)',     sub:'Single 1x electronic sight', tac:true, mod:true },
        { id:'lpvo',   name:'Magnified Optic / LPVO',      sub:'One magnified optical sight', tac:true, mod:true },
        { id:'dual',   name:'Magnified + Offset Red Dot',  sub:'Two sighting systems', tac:'Only ONE optical sight allowed (backup irons/popups only)', mod:'Only ONE optical sight allowed' }
      ]},
      { id:'muzzle', label:'Muzzle', icon:'muzzle', opts:[
        { id:'flash', name:'Bare / A2 Flash Hider',        sub:'No brake function', tac:true, mod:true },
        { id:'comp',  name:'Compensator ≤ 1" × 3"',        sub:'Within Tactical size limit', tac:true, mod:true },
        { id:'bigcomp', name:'Oversized Compensator',      sub:'Exceeds 1" dia × 3" length', tac:'Compensator max 1" diameter × 3" length', mod:'Exceeds factory-style configuration' },
        { id:'can',   name:'Suppressor',                   sub:'Explicitly allowed in Tactical', tac:true, mod:true }
      ]},
      { id:'support', label:'Support', icon:'bipod', opts:[
        { id:'none',   name:'None',                        sub:'Sling only', tac:true, mod:true },
        { id:'bipod20',name:'Bipod ≤ 20"',                 sub:'Must stay attached when used', tac:'Supporting devices (bipods, bags) not allowed in Tactical', mod:true },
        { id:'bipodxl',name:'Bipod > 20"',                 sub:'Long legs / tall shooting', tac:'Supporting devices not allowed in Tactical', mod:'Modified bipods limited to ≤ 20"' },
        { id:'bag',    name:'Support Bag',                 sub:'Bag rider / positional support', tac:'Supporting devices (bipods, bags) not allowed in Tactical', mod:true }
      ]},
      { id:'rail', label:'Rail 1', icon:'light', opts:[
        { id:'none',  name:'None', sub:'Clean handguard', tac:true, mod:true },
        { id:'light', name:'Weapon Light', sub:'Illumination only', tac:true, mod:true }
      ]},
      { id:'rail2', label:'Rail 2', icon:'laser', opts:[
        { id:'none',  name:'None', sub:'No second accessory', tac:true, mod:true },
        { id:'laser', name:'Laser', sub:'Aiming laser', tac:'Tactical allows one sighting system — a laser adds a second electronic aiming device', mod:true }
      ]}
    ],
    nodes:{
      platform:{nx:63, ny:13, ax:57, ay:40},
      caliber:{nx:85, ny:56, ax:44, ay:44},
      optic:{nx:36, ny:9, ax:41, ay:31},
      muzzle:{nx:90, ny:28, ax:80, ay:44},
      support:{nx:37, ny:84, ax:52, ay:57},
      rail:{nx:16, ny:66, ax:47, ay:53},
      rail2:{nx:14, ny:40, ax:58, ay:56}
    }
  },

  pistol: {
    label:'Pistol',
    slots: [
      { id:'platform', label:'Frame / Platform', icon:'receiver', opts:[
        { id:'factory', name:'Factory Semi-Auto',  sub:'Factory configuration, internal mods OK', tac:true, mod:true },
        { id:'custom',  name:'Custom / Race Gun',  sub:'Non-factory appearance or configuration', tac:'Tactical requires factory configuration & appearance', mod:'Modified requires factory configuration & appearance' },
        { id:'revolver',name:'Revolver',           sub:'Oddball platform — Goofy Gun candidate', tac:true, mod:true, goofy:true }
      ]},
      { id:'caliber', label:'Chambering', icon:'ammo', opts:[
        { id:'9',   name:'9mm',         sub:'Standard multigun chambering', tac:true, mod:true },
        { id:'40',  name:'.40 S&W',     sub:'Heavy Division minimum caliber', tac:true, mod:true, heavy:true },
        { id:'45',  name:'.45 ACP',     sub:'Typical Heavy Division pistol', tac:true, mod:true, heavy:true },
        { id:'357', name:'.357 Magnum', sub:'Revolver magnum — Heavy permitted', tac:true, mod:true, heavy:true }
      ]},
      { id:'optic', label:'Optic', icon:'optic', opts:[
        { id:'irons', name:'Iron Sights',              sub:'Factory or upgraded irons', tac:true, mod:true },
        { id:'slidedot', name:'Slide-Mounted Red Dot', sub:'Non-magnified, between rear sight & ejection port', tac:'No electronic, optical, or extended sights in Tactical', mod:true },
        { id:'framemount', name:'Frame-Mounted Optic', sub:'Mounted forward of the slide', tac:'No electronic, optical, or extended sights in Tactical', mod:'Optic must be slide-mounted between rear sight & ejection port' }
      ]},
      { id:'muzzle', label:'Muzzle', icon:'muzzle', opts:[
        { id:'none',  name:'Standard Barrel',   sub:'No brake or porting', tac:true, mod:true },
        { id:'comp',  name:'Compensator',       sub:'Threaded muzzle brake', tac:'Compensators & barrel porting not allowed in Tactical', mod:'Compensators & barrel porting not allowed in Modified' },
        { id:'ported',name:'Ported Barrel',     sub:'Factory or custom porting', tac:'Compensators & barrel porting not allowed in Tactical', mod:'Compensators & barrel porting not allowed in Modified' }
      ]},
      { id:'magazine', label:'Magazine', icon:'mag', opts:[
        { id:'std',   name:'Standard ≤ 140mm',  sub:'Staggered-column legal everywhere', tac:true, mod:true },
        { id:'ext',   name:'Extended 141–142mm',sub:'Inside Modified 142mm staggered limit', tac:'Tactical staggered mags max 140mm OAL (170mm single-stack)', mod:true },
        { id:'stick', name:'Big Stick > 142mm', sub:'Beyond staggered limits', tac:'Exceeds Tactical 140mm staggered limit', mod:'Exceeds Modified 142mm staggered limit (172mm single-stack)' }
      ]},
      { id:'rail', label:'Rail', icon:'light', opts:[
        { id:'none',  name:'None',       sub:'Clean dust cover', tac:true, mod:true },
        { id:'light', name:'Flashlight', sub:'Explicitly allowed in Modified', tac:true, mod:true },
        { id:'laser', name:'Laser',      sub:'Aiming laser', tac:'Electronic sighting devices not allowed in Tactical', mod:'Lasers prohibited on Modified handguns' }
      ]}
    ],
    nodes:{
      platform:{nx:30, ny:16, ax:42, ay:38},
      caliber:{nx:77, ny:22, ax:60, ay:36},
      optic:{nx:52, ny:8, ax:44, ay:33},
      muzzle:{nx:88, ny:48, ax:71, ay:42},
      magazine:{nx:66, ny:84, ax:38, ay:72},
      rail:{nx:22, ny:72, ax:57, ay:52}
    }
  },

  shotgun: {
    label:'Shotgun',
    slots: [
      { id:'platform', label:'Action / Feeding', icon:'receiver', opts:[
        { id:'pump',   name:'Tube-Fed Pump',          sub:'Factory configuration', tac:true, mod:true },

/* =====================================================================
   STATE + CLASSIFIER
   ===================================================================== */
const state = {};
for (const w in WEAPONS){ state[w] = {}; WEAPONS[w].slots.forEach(s => state[w][s.id] = s.opts[0].id); }
const openViol = { rifle:null, pistol:null, shotgun:null };
const openSlot = { rifle:null, pistol:null, shotgun:null };

function getOpt(w, slotId){
  const slot = WEAPONS[w].slots.find(s => s.id === slotId);
  return slot ? slot.opts.find(o => o.id === state[w][slotId]) : null;
}
function classify(w){
  const res = { tac:{ok:true, viol:[]}, mod:{ok:true, viol:[]}, open:{ok:true, viol:[]}, goofy:false, heavy:false };
  WEAPONS[w].slots.forEach(slot => {
    const o = getOpt(w, slot.id);
    if (o.tac !== true){ res.tac.ok = false; res.tac.viol.push(`${slot.label}: ${o.name} — ${o.tac}`); }
    if (o.mod !== true){ res.mod.ok = false; res.mod.viol.push(`${slot.label}: ${o.name} — ${o.mod}`); }
    if (o.goofy) res.goofy = true;
    if (o.heavy) res.heavy = true;
  });
  res.current = res.tac.ok ? 'tac' : (res.mod.ok ? 'mod' : 'open');
  return res;
}
function classifyMatch(){
  const r = classify('rifle'), p = classify('pistol'), s = classify('shotgun');
  const eligible = ['tac','mod','open'].filter(d => r[d].ok && p[d].ok && s[d].ok);
  return { rifle:r, pistol:p, shotgun:s, current:eligible[0], heavy:r.heavy && p.heavy, goofy:r.goofy || p.goofy || s.goofy };
}

/* =====================================================================
   RENDER
   ===================================================================== */
function pillRow(o){
  const pills = [
    `<span class="pill ${o.tac===true?'y':'n'}">TAC</span>`,
    `<span class="pill ${o.mod===true?'y':'n'}">MOD</span>`,
    `<span class="pill y">OPEN</span>`
  ];
  if (o.goofy) pills.push('<span class="pill g">GOOFY</span>');
  if (o.heavy) pills.push('<span class="pill g">HEAVY</span>');
  return `<div class="pills">${pills.join('')}</div>`;
}

function gunStage(w){
  if (MODELS[w]){
    loadModelViewer();
    return `<model-viewer src="${MODELS[w]}" camera-controls auto-rotate shadow-intensity="1" exposure="1.05"></model-viewer>`;
  }
  const img = IMAGES[w];
  if (img && img.base){
    let layers = `<img class="layer-img" src="${img.base}" alt="">`;
    for (const slotId in img.overlays){
      const url = img.overlays[slotId][state[w][slotId]];
      if (url) layers += `<img class="layer-img" src="${url}" alt="">`;
    }
    return `<div style="position:relative">${layers}</div>`;
  }
  return svgFor(w);
}

function renderScreen(w){
  const c = classify(w);
  const el = document.getElementById('screen-'+w);
  const wcfg = WEAPONS[w];

  const wires = wcfg.slots.map(s => {
    const n = wcfg.nodes[s.id];
    return `<line x1="${n.nx}" y1="${n.ny}" x2="${n.ax}" y2="${n.ay}"/><circle cx="${n.ax}" cy="${n.ay}" r="0.45"/>`;
  }).join('');

  const nodes = wcfg.slots.map(s => {
    const n = wcfg.nodes[s.id];
    const o = getOpt(w, s.id);
    const conflict = (o.tac !== true || o.mod !== true);
    return `<div class="node ${openSlot[w]===s.id?'sel':''} ${conflict?'conflict':''}" style="left:${n.nx}%; top:${n.ny}%" onclick="toggleSlot('${w}','${s.id}')">
      <div class="n-lbl">${s.label}</div>
      <div class="n-box clip-sm"><svg viewBox="0 0 38 38">${ICONS[s.icon]||''}</svg></div>
      <div class="n-cur">${o.name}</div>
    </div>`;
  }).join('');

  let flyout = '';
  if (openSlot[w]){
    const slot = wcfg.slots.find(s => s.id === openSlot[w]);
    const sel = getOpt(w, slot.id);
    flyout = `<div class="flyout clip-sm">
      <div class="f-head"><span class="t">${slot.label}</span><span class="x" onclick="toggleSlot('${w}','${slot.id}')">✕ CLOSE</span></div>
      <div class="f-body">${slot.opts.map(o => `
        <div class="opt ${o.id===sel.id?'sel':''}" onclick="pick('${w}','${slot.id}','${o.id}')">
          <div><div class="o-name">${o.name}</div><span class="o-sub">${o.sub}</span></div>
          ${pillRow(o)}
        </div>`).join('')}
      </div>
    </div>`;
  }

  let viol = '';
  if (openViol[w]){
    const d = openViol[w];
    const list = c[d].viol.length
      ? `<ul>${c[d].viol.map(v=>`<li>${v}</li>`).join('')}</ul>`
      : `<div class="allclear">ALL CLEAR — this build is legal in ${DIV_META[d].name}.</div>`;
    viol = `<div class="viol clip-sm"><span class="x" onclick="toggleViol('${w}','${d}')">✕</span><h4>${DIV_META[d].name} — Rule Check</h4>${list}</div>`;
  }

  const rows = ['tac','mod','open'].map(d => {
    const ok = c[d].ok;
    return `<div class="st-row ${ok?'ok':'bad'}" onclick="toggleViol('${w}','${d}')">
        <span class="n">${DIV_META[d].name}</span>
        <span class="s">${ok?'ELIGIBLE':c[d].viol.length+' CONFLICT'+(c[d].viol.length>1?'S':'')}</span>
      </div>
      <div class="st-bar"><i style="width:${ok?100:Math.max(8, 100-34*c[d].viol.length)}%"></i></div>`;
  }).join('');

  el.innerHTML = `<div class="stage">
    <svg class="wires" viewBox="0 0 100 100" preserveAspectRatio="none">${wires}</svg>
    <div class="gun-wrap" id="gunwrap-${w}">${gunStage(w)}</div>
    ${nodes}
    <div class="info">
      <div class="w-name">${wcfg.label}</div>
      <div class="w-div-lbl">${wcfg.label} Division</div>
      <div class="w-div clip-sm">${DIV_META[c.current].name}</div>
      <div class="g-flags">
        ${c.goofy?'<div class="flag on">GOOFY GUN CANDIDATE</div>':''}
        ${c.heavy?'<div class="flag on">HEAVY CALIBER</div>':''}
      </div>
    </div>
    <div class="stats clip-sm">
      <h3>Division Eligibility — ${wcfg.label}</h3>
      ${rows}
      <div class="actions">
        <button class="act" onclick="copyLoadout()">Copy Loadout</button>
        <button class="act ghost" onclick="resetWeapon('${w}')">Reset</button>
      </div>
      <div class="copied" id="copied-${w}">COPIED TO CLIPBOARD</div>
    </div>
    ${viol}
    ${flyout}
    <footer>Rules: <a href="https://www.floridamultigun.com/divisions" target="_blank" rel="noopener">floridamultigun.com/divisions</a> — silent items resolved permissively; Match Director makes final equipment calls.</footer>
  </div>`;
}

function renderHeader(){
  const m = classifyMatch();
  document.getElementById('matchDiv').textContent = DIV_META[m.current].name;
  document.getElementById('flag-heavy').classList.toggle('on', m.heavy);
  document.getElementById('flag-goofy').classList.toggle('on', m.goofy);
}
function renderAll(){ ['rifle','pistol','shotgun'].forEach(renderScreen); renderHeader(); }

/* =====================================================================
   INTERACTION
   ===================================================================== */
function showTab(w){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('tab-'+w).classList.add('active');
  document.getElementById('screen-'+w).classList.add('active');
}
function toggleSlot(w, slotId){ openSlot[w] = (openSlot[w]===slotId)?null:slotId; renderScreen(w); }
function pick(w, slotId, optId){ state[w][slotId] = optId; renderScreen(w); renderHeader(); }
function toggleViol(w, d){ openViol[w] = (openViol[w]===d)?null:d; renderScreen(w); }
function resetWeapon(w){
  WEAPONS[w].slots.forEach(s => state[w][s.id] = s.opts[0].id);
  openViol[w] = null; openSlot[w] = null;
  renderScreen(w); renderHeader();
}
function copyLoadout(){
  const m = classifyMatch();
  let txt = `FLORIDA MULTIGUN LOADOUT\nMatch Division: ${DIV_META[m.current].name}`;
  if (m.heavy) txt += `  [HEAVY ELIGIBLE]`;
  if (m.goofy) txt += `  [GOOFY GUN]`;
  txt += `\n`;
  ['rifle','pistol','shotgun'].forEach(w => {
    txt += `\n${WEAPONS[w].label.toUpperCase()} — ${DIV_META[classify(w).current].name}\n`;
    WEAPONS[w].slots.forEach(s => { txt += `  ${s.label}: ${getOpt(w,s.id).name}\n`; });
  });
  txt += `\nRules: floridamultigun.com/divisions`;
  navigator.clipboard.writeText(txt).then(()=>{
    document.querySelectorAll('.copied').forEach(c=>c.classList.add('show'));
    setTimeout(()=>document.querySelectorAll('.copied').forEach(c=>c.classList.remove('show')), 1800);
  });
}
let mvLoaded = false;
function loadModelViewer(){
  if (mvLoaded) return; mvLoaded = true;
  const s = document.createElement('script'); s.type = 'module'; s.src = MODEL_VIEWER_CDN;
  document.head.appendChild(s);
}

    <rect x="862" y="140" width="38" height="14" fill="#4a4e52"/>
  </g>

  <!-- bead -->
  <g class="${show(s.optic==='bead')}">
    <rect x="884" y="136" width="9" height="7" fill="${B}" stroke="${W}" stroke-width="1.2"/>
    <circle cx="888" cy="132" r="3.5" fill="${W}"/>
  </g>

  <!-- red dot -->
  <g class="${show(s.optic==='dot')}">
    <g filter="url(#sglow)">
      <rect x="270" y="118" width="88" height="14" rx="2" fill="${B}" stroke="${O}"/>
      ${marks(278,6,13,121,5,8,W,1)}
      <rect x="278" y="76" width="80" height="42" rx="10" fill="${B}" stroke="${W}" stroke-width="1.8"/>
      <circle cx="340" cy="97" r="14" fill="${B}" stroke="${W}" stroke-width="2"/>
      <circle cx="340" cy="97" r="8" fill="none" stroke="${W}" stroke-width="1" opacity=".7"/>
      <circle cx="340" cy="97" r="3" fill="url(#sreddot)"/>
      <rect x="290" y="80" width="10" height="5" fill="${W}"/>
    </g>
    <text class="svg-label" x="268" y="64">RED DOT</text>
  </g>

  <!-- magnified -->
  <g class="${show(s.optic==='mag')}">
    <g filter="url(#sglow)">
      <rect x="264" y="118" width="100" height="8" fill="${B}" stroke="${O}"/>
      <rect x="252" y="90" width="118" height="20" rx="8" fill="${B}" stroke="${W}" stroke-width="1.6"/>
      <rect x="226" y="84" width="28" height="30" rx="6" fill="${B}" stroke="${W}" stroke-width="1.5"/>
      <path fill="${B}" stroke="${W}" stroke-width="1.5" d="M370 86 L408 79 Q415 100 408 121 L370 114 Z"/>
      <ellipse cx="409" cy="100" rx="4" ry="17" fill="none" stroke="${W}" stroke-width="1.2"/>
    </g>
    <text class="svg-label" x="250" y="70">MAGNIFIED OPTIC</text>
  </g>

  <!-- comp -->
  <g class="${show(s.muzzle==='comp')}">
    <g filter="url(#sglow)">
      <path fill="${B}" stroke="${O}" d="M900 138 L948 138 Q956 138 956 146 L956 152 Q956 160 948 160 L900 160 Z"/>
      <rect x="912" y="141" width="7" height="16" fill="${W}"/><rect x="930" y="141" width="7" height="16" fill="${W}"/>
      ${marks(908,3,14,131,7,5,W,1)}
    </g>
    <text class="svg-label" x="884" y="120">COMP / PORTED</text>
  </g>

  <!-- bipod -->
  <g class="${show(s.support==='bipod20')}">
    <g filter="url(#sglow)">
      <rect x="596" y="177" width="20" height="11" fill="${B}" stroke="${W}" stroke-width="1.3"/>
      <line x1="603" y1="188" x2="576" y2="258" stroke="${B}" stroke-width="7"/>
      <line x1="609" y1="188" x2="636" y2="258" stroke="${B}" stroke-width="7"/>
      <line x1="603" y1="188" x2="576" y2="258" stroke="${W}" stroke-width="1.5"/>
      <line x1="609" y1="188" x2="636" y2="258" stroke="${W}" stroke-width="1.5"/>
    </g>
    <text class="svg-label" x="570" y="280">BIPOD ≤20"</text>
  </g>

  <!-- light / laser -->
  <g class="${show(s.rail==='light')}">
    <g filter="url(#sglow)">
      <rect x="636" y="150" width="8" height="34" rx="3" fill="${B}" stroke="${W}" stroke-width="1.2"/>
      <rect x="618" y="184" width="46" height="20" rx="6" fill="${B}" stroke="${O}"/>
      <rect x="662" y="181" width="11" height="26" rx="3" fill="${B}" stroke="${W}" stroke-width="1.4"/>
    </g>
    <text class="svg-label" x="614" y="230">LIGHT</text>
  </g>
  <g class="${show(s.rail==='laser')}">
    <g filter="url(#sglow)">
      <rect x="636" y="150" width="8" height="34" rx="3" fill="${B}" stroke="${W}" stroke-width="1.2"/>
      <rect x="622" y="184" width="40" height="17" rx="5" fill="${B}" stroke="${W}" stroke-width="1.4"/>
      <circle cx="658" cy="192" r="3.2" fill="#ff5a4d"/>
    </g>
    <line x1="664" y1="192" x2="990" y2="192" stroke="#ff5a4d" stroke-opacity=".8" stroke-width="2" stroke-dasharray="9 8"/>
    <text class="svg-label" x="616" y="226">LASER</text>
  </g>
  </svg>`;
}

/* label style used inside svgs */
const style = document.createElement('style');
style.textContent = `.svg-label{font-family:${getComputedStyle(document.documentElement).getPropertyValue('--mono')}; font-size:11px; fill:#f0b350; opacity:.85; letter-spacing:1.5px;} .hidden{display:none;}`;
document.head.appendChild(style);

/* boot */
renderAll();
</script>
</body>
